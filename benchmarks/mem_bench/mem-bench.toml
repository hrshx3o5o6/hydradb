[run]
benchmark = "longmemeval"
split = "s"
limit = 0

[adapter]
name = "hydradna:HydraDNAAdapter"

[judge]
enabled = true
model = "gpt-4o-mini"
provider = "openai"
api_key_env = "OPENAI_API_KEY"

[metrics]
retrieval_k = [1, 3, 5, 10]
include_latency = true

[reporting]
formats = ["console", "json", "markdown"]